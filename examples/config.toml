# idlemax config for the Mac (agent). Copy to ~/.idlemax/config.toml after `idlemax init`.
# Every key is optional; anything left out uses the built-in default shown in the comment.
# The server has its own file: examples/config.server.toml.

[coordinator]
# Where this agent and the CLI reach the coordinator: the server over the tailnet.
url = "http://100.64.0.10:7878"

[agent]
# Device id used in job specs' `devices`; defaults to the hostname.
device_id = "my-laptop"
# Guard preset: laptop (default on macOS), workbox, or production.
profile = "laptop"
# Local agent API, always loopback: `idlemax local status|stop-all|resume`.
listen = "127.0.0.1:7879"
sample_secs = 30
heartbeat_secs = 30
# AI accounts this device may spend: only where you logged in to the CLIs yourself.
ai_accounts = ["claude-max", "codex-pro"]
# argv[0] values a job may run. Empty allows nothing.
command_allowlist = [
  "/path/to/idlemax/examples/scripts/kb-refresh.sh",
  "/path/to/idlemax/examples/scripts/index-refresh.sh",
  "/path/to/idlemax/examples/scripts/repo-health.sh",
  "/path/to/idlemax/examples/scripts/pr-review-drafts.sh",
]

# Overrides on top of the profile preset (docs/PLAN.md "Guard presets"); unknown keys are errors.
[guard]
# load_per_cpu_pause = 1.0
# user_idle_min_secs = 600
# mem_free_pct_pause = 30.0

# Dispatcher quota brain settings (defaults shown; apply live on mtime change).
# Tier models left unset mean the provider is not used for that tier.
# [quota]
# owner_reserve_pct = 50.0
# safety_margin_pct = 10.0
# five_hour_stop_pct = 60.0
# last_day_floor_pct = 15.0
# seed_small_pct = 3.0
# seed_standard_pct = 8.0
# small_task_types = ["broken_check"]
# claude_small_model = "haiku"
# claude_standard_model = "sonnet"
# codex_small_model = "<model>"
# codex_standard_model = "<model>"
# agy_small_model = "<model>"
# agy_standard_model = "<model>"
# opencode_small_model = "<model>"
# opencode_standard_model = "<model>"

# Keep the accounts identical on every device and on the coordinator.
# Windows left out use the provider defaults (reserve 40% per 5-hour window, 30% weekly,
# 15% in the last 24 h before the weekly reset).
# Accounts on agy or opencode set daily_cap_runs (e.g. daily_cap_runs = 5).
[[quota.accounts]]
name = "claude-max"
provider = "claude"
probe = "claude_statusline"
windows = [
  { kind = "rolling", minutes = 300, reserve_pct = 40.0 },
  { kind = "weekly", reserve_pct = 30.0, final_day_reserve_pct = 15.0 },
]

[[quota.accounts]]
name = "codex-pro"
provider = "codex"
probe = "codex_sessions"
# Codex Pro reports only the weekly window.
windows = [{ kind = "weekly", reserve_pct = 30.0, final_day_reserve_pct = 15.0 }]
