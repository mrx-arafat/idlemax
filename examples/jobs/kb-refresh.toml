# MVP job 1a: fast-forward a notes or knowledge-base repo and report what changed.
# Queue it: idlemax job add examples/jobs/kb-refresh.toml
# Repeat it (four times a day, whenever the machine is idle): idlemax schedule add examples/jobs/kb-refresh.toml
name = "kb-refresh"
every = "6h"
command = ["/path/to/idlemax/examples/scripts/kb-refresh.sh"]
cost = "cpu_light"
requires = ["git"]
devices = ["my-laptop"]
priority = 4
mem_mb = 384
max_runtime_secs = 1800
# Kill rather than SIGSTOP: a stopped job would hold the repo's git lock.
on_user_active = "kill"

[env]
KB_DIR = "/path/to/notes"
