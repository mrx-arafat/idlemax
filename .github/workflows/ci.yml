name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded pull request runs are cancelled; every commit on main keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: clippy and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      # Hide the systemd user manager. Without it the Linux agent picks the plain `nice`
      # throttle, so the job tests behave the same on every host. Under a systemd scope,
      # MemoryHigh throttles a memory hog before idlemax's own RSS cap sees it, and the
      # memory-cap test would wait for a kill that never comes. The scope argv is pinned by
      # unit tests; its live caps are checked by scripts/verify-linux.sh on a real host.
      XDG_RUNTIME_DIR: /nonexistent/no-user-bus
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # The committed agent skill is generated from the home view's text; fail when it drifts.
      - name: Agent skill is current
        if: runner.os == 'Linux'
        run: cargo run --locked --quiet -p idlemax -- skill --check

  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh scripts/test-install.sh
      - name: Test scripts/install.sh
        run: sh scripts/test-install.sh
