name: Bug report
description: File a bug report to help us improve idlemax
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue.
        Please provide the details below so we can investigate and fix it.
  - type: input
    id: version
    attributes:
      label: idlemax version
      description: The output of `idlemax --version`.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: os-arch
    attributes:
      label: OS and architecture
      description: Operating system and architecture (e.g. macOS 15.1 arm64 or Ubuntu 24.04 x86_64).
      placeholder: "macOS 15.1 arm64"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Run `idlemax ...`
        2. Observe error
    validations:
      required: true
  - type: textarea
    id: status-output
    attributes:
      label: Output of idlemax status
      description: Output from running `idlemax status`.
      render: shell
    validations:
      required: false
  - type: textarea
    id: local-status-output
    attributes:
      label: Output of idlemax local status
      description: Output from running `idlemax local status` on the affected host.
      render: shell
    validations:
      required: false
  - type: textarea
    id: guard-reasons
    attributes:
      label: Relevant guard reasons
      description: Any guard verdicts, hold/pause reasons, or metric breaches reported by idlemax.
      placeholder: "e.g. hold: load 1.70 > 1.5 or pause: disk free 13756.2 MiB < 15360 MiB"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context or logs
      description: Relevant lines from `$IDLEMAX_HOME/logs/` or configuration snippets.
    validations:
      required: false
