<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>idlemax</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f6b66'/%3E%3Cpath d='M5 4h2v8H5zM9 4h2v8H9z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --bg: #f3f4f6;
  --panel: #ffffff;
  --panel-2: #f8f9fa;
  --ink: #16191d;
  --muted: #5c6570;
  --faint: #6b747e;
  --line: #e0e4e9;
  --line-strong: #c9cfd6;
  --control: #858d97;
  --accent: #0f6b66;
  --accent-ink: #ffffff;
  --ok: #17663f;
  --ok-bg: #e3f3ea;
  --warn: #855400;
  --warn-bg: #fbefd5;
  --bad: #b0261c;
  --bad-bg: #fbe7e4;
  --info: #24529f;
  --info-bg: #e6edfa;
  --neutral-bg: #eaedf1;
  --focus: #2d6fd6;
  --radius: 8px;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0e1013;
    --panel: #16191e;
    --panel-2: #1b1f25;
    --ink: #e6e9ed;
    --muted: #9ba4ae;
    --faint: #808993;
    --line: #272c33;
    --line-strong: #363c45;
    --control: #6b747e;
    --accent: #3cb3a9;
    --accent-ink: #071413;
    --ok: #55c48e;
    --ok-bg: #12301f;
    --warn: #e2ac43;
    --warn-bg: #33270e;
    --bad: #f17b70;
    --bad-bg: #3a1613;
    --info: #80a9ef;
    --info-bg: #14223a;
    --neutral-bg: #232830;
    --focus: #6ea2f5;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
[hidden] { display: none !important; }

/* Header */
.top {
  position: sticky; top: 0; z-index: 5;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 1320px; margin: 0 auto; padding: 10px 16px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
}
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
.brand h1 { font-size: 17px; margin: 0; letter-spacing: 0.01em; }
.brand .ver { font-size: 12px; color: var(--faint); }
.updated { font-size: 12px; color: var(--muted); white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 12px;
  border: 1px solid var(--line-strong); border-radius: 6px;
  background: var(--panel); color: var(--ink);
  cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: 500;
}
.btn:hover { background: var(--panel-2); }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line-strong)); }
.btn.danger:hover { background: var(--bad-bg); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: var(--accent-ink); }
.btn.danger.solid:hover { background: var(--bad); filter: brightness(1.08); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--panel-2); }

/* Badges */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 7px; border-radius: 10px;
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.01em;
  background: var(--neutral-bg); color: var(--muted); white-space: nowrap;
}
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.info { background: var(--info-bg); color: var(--info); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }

/* Layout */
main { max-width: 1320px; margin: 0 auto; padding: 16px; }
.banner {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding: 10px 14px; margin-bottom: 14px;
  border-radius: var(--radius); border: 1px solid; font-weight: 500;
}
.banner.warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.banner.bad { background: var(--bad-bg); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 22px; font-weight: 600; line-height: 1.2; margin-top: 2px; }
.tile .v.bad { color: var(--bad); }
.tile .v.warn { color: var(--warn); }
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1080px) { .grid { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); } }
.col { display: grid; gap: 14px; align-content: start; min-width: 0; }

/* Cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.card-h {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  padding: 12px 14px; border-bottom: 1px solid var(--line);
}
.card-h h2 { font-size: 13.5px; margin: 0 auto 0 0; font-weight: 650; }
.card-b { padding: 12px 14px; }
.card-b.flush { padding: 0; }
.empty { color: var(--muted); padding: 14px; text-align: center; font-size: 13px; }
.err { color: var(--bad); padding: 10px 14px; font-size: 13px; }

/* Devices */
.devices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.dev { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; background: var(--panel-2); min-width: 0; }
.dev-h { display: flex; align-items: flex-start; gap: 8px; }
.dev-h .name { font-weight: 650; overflow-wrap: anywhere; }
.dev-h .sub { font-size: 12px; color: var(--muted); }
.dev-h .badges { margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
.guard { margin: 10px 0 0; font-size: 12.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.reasons { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); }
.reasons li { display: flex; gap: 5px; overflow-wrap: anywhere; }
.reasons li::before { content: "-"; flex: none; color: var(--faint); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 10px; margin-top: 10px; }
.stat .k { font-size: 11px; color: var(--muted); }
.stat .v { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.dev-jobs { margin-top: 10px; font-size: 12.5px; display: grid; gap: 4px; }
.dev-jobs .row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.dev-jobs .row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dev-jobs .row .badge, .dev-jobs .row .faint { flex: none; white-space: nowrap; }
.dev-a { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

/* Tables */
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--panel-2); white-space: nowrap; }
th:first-child, td:first-child { padding-left: 14px; }
th:last-child, td:last-child { padding-right: 14px; }
tbody tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td.nw { white-space: nowrap; }
td.c-dev { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td .t2 { font-size: 12px; color: var(--muted); margin-top: 1px; overflow-wrap: anywhere; }
td.acts { white-space: nowrap; text-align: right; }
td.acts .btn + .btn { margin-left: 4px; }
.job-name { font-weight: 600; overflow-wrap: anywhere; }

/* Why a queued, leased or paused job is not running: one line, expandable to every reason. */
.why { margin-top: 6px; font-size: 12.5px; }
.why summary { cursor: pointer; color: var(--muted); overflow-wrap: anywhere; }
.why summary .tag { color: var(--warn); font-weight: 600; }
.why summary .more { color: var(--faint); white-space: nowrap; }
.why-body { margin-top: 6px; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; overflow-wrap: anywhere; }
.why-h { margin-top: 8px; font-size: 12px; font-weight: 600; }
.why-h:first-child { margin-top: 0; }
.why-list { margin: 4px 0 0; padding-left: 18px; }
.why-list li + li { margin-top: 6px; }
.why-list .fix { color: var(--muted); }
.why-note { margin-top: 8px; color: var(--muted); }
.why-note:first-child { margin-top: 0; }
.sched-table td.c-state > div + div { margin-top: 4px; }
select {
  height: 28px; padding: 0 8px; border: 1px solid var(--control); border-radius: 6px;
  background: var(--panel); font-size: 12.5px;
}

/* Quota */
.acct + .acct { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.acct-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.acct-h .name { font-weight: 650; margin-right: auto; }
.win { margin-top: 10px; }
.win-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; font-size: 12.5px; }
.meter { position: relative; height: 8px; border-radius: 4px; background: var(--neutral-bg); margin-top: 5px; overflow: hidden; }
.meter > span { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; }
.meter > span.warn { background: var(--warn); }
.meter > span.bad { background: var(--bad); }
.meter > i { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--ink); opacity: 0.55; }
.win .reasons { margin-top: 4px; }

/* Advice */
.adv + .adv { border-top: 1px solid var(--line); }
.adv { padding: 12px 14px; }
.adv-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
.adv-h .title { font-weight: 650; flex: 1 1 200px; overflow-wrap: anywhere; }
.adv p { margin: 6px 0 0; color: var(--ink); overflow-wrap: anywhere; }
.adv .meta { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.adv details { margin-top: 6px; font-size: 12.5px; }
.adv summary { cursor: pointer; color: var(--muted); }
.adv ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
.adv li { overflow-wrap: anywhere; }
.adv .sugg { margin-top: 8px; font-size: 12.5px; padding: 8px 10px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); overflow-wrap: anywhere; }
.adv-a { display: flex; gap: 6px; margin-top: 10px; }
.adv.closed { opacity: 0.7; }

/* Events: a log pane, so it scrolls instead of stretching the page */
#events { max-height: min(60vh, 520px); overflow-y: auto; overscroll-behavior: contain; }
.ev { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 2px 10px; padding: 7px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.ev:last-child { border-bottom: 0; }
.ev .when { color: var(--muted); }
.ev .what { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0; }
.ev .msg { grid-column: 2; overflow-wrap: anywhere; }

/* Login */
.login { max-width: 420px; margin: 12vh auto 0; padding: 0 16px; }
.login .card-b { display: grid; gap: 10px; }
.login label { font-size: 13px; color: var(--muted); }
.login input {
  height: 36px; padding: 0 10px; border: 1px solid var(--control); border-radius: 6px;
  background: var(--panel); width: 100%;
}
.login code { font-family: var(--mono); font-size: 12px; background: var(--neutral-bg); padding: 1px 5px; border-radius: 4px; }
.login .err { padding: 0; }

/* Dialog and toasts */
dialog {
  border: 1px solid var(--line-strong); border-radius: 10px; padding: 0;
  background: var(--panel); color: var(--ink); width: min(440px, calc(100vw - 32px));
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
}
dialog::backdrop { background: rgba(10, 12, 15, 0.45); }
dialog .card-b p { margin: 0; }
dialog .foot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 14px 14px; }
.toasts { position: fixed; right: 16px; bottom: 16px; left: 16px; display: grid; justify-items: end; gap: 8px; pointer-events: none; z-index: 20; }
.toast {
  max-width: min(420px, 100%);
  padding: 9px 12px; border-radius: 8px; font-size: 13px;
  background: var(--ink); color: var(--panel); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
}
.toast.bad { background: var(--bad-bg); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }

/* Phone: jobs become stacked cards, the header stops sticking, targets reach 44 px. */
@media (max-width: 640px) {
  .jobs-table thead { display: none; }
  .jobs-table, .jobs-table tbody { display: block; }
  .jobs-table tr {
    display: grid; grid-template-columns: 3.2rem minmax(0, 1fr) auto;
    grid-template-areas: "id job status" ". dev created" ". acts acts";
    gap: 4px 10px; padding: 12px 14px; border-bottom: 1px solid var(--line);
  }
  .jobs-table tbody tr:last-child { border-bottom: 0; }
  .jobs-table td { display: block; padding: 0; border: 0; text-align: left; }
  .jobs-table td.c-id { grid-area: id; }
  .jobs-table td.c-job { grid-area: job; }
  .jobs-table td.c-status { grid-area: status; text-align: right; }
  .jobs-table td.c-dev { grid-area: dev; max-width: none; }
  .jobs-table td.c-dev > .faint { display: none; }
  .jobs-table td.c-created { grid-area: created; text-align: right; }
  .jobs-table td.acts { grid-area: acts; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; white-space: normal; }
  .jobs-table td.acts:empty { display: none; }
  .jobs-table td.acts .btn + .btn { margin-left: 0; }
}
@media (max-width: 640px) {
  .sched-table thead { display: none; }
  .sched-table, .sched-table tbody { display: block; }
  .sched-table tr {
    display: grid; grid-template-columns: 3.2rem minmax(0, 1fr) auto;
    grid-template-areas: "id name state" ". last last" ". acts acts";
    gap: 4px 10px; padding: 12px 14px; border-bottom: 1px solid var(--line);
  }
  .sched-table tbody tr:last-child { border-bottom: 0; }
  .sched-table td { display: block; padding: 0; border: 0; text-align: left; }
  .sched-table td.c-id { grid-area: id; }
  .sched-table td.c-name { grid-area: name; }
  .sched-table td.c-state { grid-area: state; text-align: right; }
  .sched-table td.c-last { grid-area: last; }
  .sched-table td.acts { grid-area: acts; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; white-space: normal; }
  .sched-table td.acts .btn + .btn { margin-left: 0; }
}
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tiles .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .btn { height: 44px; }
  .btn.sm { height: 40px; padding: 0 12px; }
  select { height: 40px; }
  .top { position: static; }
  .top-in { padding: 10px 16px; }
  .actions { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .actions .btn { padding: 0 6px; }
  #btn-logout { grid-column: span 2; }
}
</style>
</head>
<body>
<noscript><p style="padding:16px">The idlemax dashboard needs JavaScript.</p></noscript>

<section class="login" id="login" hidden>
  <div class="card">
    <div class="card-h"><h2>Connect to idlemax</h2></div>
    <form class="card-b" id="login-form" autocomplete="off">
      <label for="token-input">Paste the token from <code>$IDLEMAX_HOME/token</code> on the coordinator.</label>
      <input id="token-input" type="password" spellcheck="false" autocapitalize="off" required>
      <div class="err" id="login-err" role="alert" hidden></div>
      <div><button class="btn primary" type="submit">Connect</button></div>
    </form>
  </div>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand"><h1>idlemax</h1><span class="ver" id="ver"></span><span id="cluster-badge"></span></div>
      <span class="updated" id="updated" aria-live="polite"></span>
      <div class="actions">
        <button class="btn" type="button" id="btn-refresh">Refresh</button>
        <button class="btn" type="button" id="btn-pause">Pause all</button>
        <button class="btn" type="button" id="btn-resume">Resume all</button>
        <button class="btn danger" type="button" id="btn-stop">Stop all</button>
        <button class="btn ghost" type="button" id="btn-logout" title="Forget the token in this browser">Forget token</button>
      </div>
    </div>
  </header>

  <main>
    <div id="banners"></div>
    <div class="tiles" id="tiles"></div>
    <div class="grid">
      <div class="col">
        <section class="card" aria-labelledby="h-devices">
          <div class="card-h"><h2 id="h-devices">Devices</h2></div>
          <div class="card-b" id="devices"></div>
        </section>
        <section class="card" aria-labelledby="h-schedules">
          <div class="card-h"><h2 id="h-schedules">Schedules</h2></div>
          <div class="card-b flush" id="schedules"></div>
        </section>
        <section class="card" aria-labelledby="h-jobs">
          <div class="card-h">
            <h2 id="h-jobs">Jobs</h2>
            <label class="muted" for="job-filter" style="font-size:12px">Status</label>
            <select id="job-filter">
              <option value="">All</option>
              <option>queued</option><option>leased</option><option>running</option><option>paused</option>
              <option>succeeded</option><option>failed</option><option>killed</option><option>cancelled</option><option>parked</option>
            </select>
          </div>
          <div class="card-b flush" id="jobs"></div>
        </section>
      </div>
      <div class="col">
        <section class="card" aria-labelledby="h-advice">
          <div class="card-h">
            <h2 id="h-advice">Advice</h2>
            <button class="btn sm" type="button" id="btn-advice-refresh">Re-run advisor</button>
          </div>
          <div class="card-b flush" id="advice"></div>
        </section>
        <section class="card" aria-labelledby="h-quota">
          <div class="card-h"><h2 id="h-quota">AI quota</h2></div>
          <div class="card-b" id="quota"></div>
        </section>
        <section class="card" aria-labelledby="h-events">
          <div class="card-h"><h2 id="h-events">Events</h2></div>
          <div class="card-b flush" id="events" tabindex="0" role="region" aria-labelledby="h-events"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<dialog id="confirm" aria-labelledby="confirm-title">
  <div class="card-h"><h2 id="confirm-title">Confirm</h2></div>
  <div class="card-b"><p id="confirm-text"></p></div>
  <div class="foot">
    <button class="btn" type="button" id="confirm-no">Cancel</button>
    <button class="btn primary" type="button" id="confirm-yes">Confirm</button>
  </div>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
"use strict";

const POLL_MS = 5000;
const TOKEN_KEY = "idlemax.token";
const ACTIVE = new Set(["leased", "running", "paused"]);
const TERMINAL = new Set(["succeeded", "failed", "killed", "cancelled", "parked"]);
// Jobs that wait for something: GET /v1/why explains these.
const WAITING = new Set(["queued", "leased", "paused"]);

// Token: localStorage when available, memory otherwise.
let memToken = "";
const tokenStore = {
  get() { try { return localStorage.getItem(TOKEN_KEY) || memToken; } catch (_) { return memToken; } },
  set(v) {
    memToken = v;
    try { if (v) localStorage.setItem(TOKEN_KEY, v); else localStorage.removeItem(TOKEN_KEY); } catch (_) { /* private mode */ }
  },
};

// DOM helper. Children are appended as text nodes, never parsed as HTML.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : String(v));

// Formatting.
function fmtBytes(b) {

  if (gib >= 1) return `${gib.toFixed(gib >= 100 ? 0 : 1)} GiB`;
  return `${Math.round(b / 1048576)} MiB`;
}
function fmtPct(p, digits = 0) { return p == null || !isFinite(p) ? "-" : `${Number(p).toFixed(digits)}%`; }

  secs = Math.max(0, Math.round(secs));
  if (secs < 60) return `${secs}s`;
  const m = Math.floor(secs / 60);
  if (m < 60) return `${m}m`;
  const hr = Math.floor(m / 60);
  if (hr < 48) return m % 60 ? `${hr}h ${m % 60}m` : `${hr}h`;
  return `${Math.floor(hr / 24)}d ${hr % 24}h`;
}
function fmtAgo(ms) {

function fmtTime(ms) {

    : t.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

const JOB_TONE = { queued: "", leased: "info", running: "info", paused: "warn", succeeded: "ok", failed: "bad", killed: "bad", cancelled: "", parked: "warn" };

// API.
class AuthError extends Error {}
async function api(method, path, body) {
  const headers = { Authorization: `Bearer ${tokenStore.get()}`, Accept: "application/json" };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const res = await fetch(path, {
    method, headers, cache: "no-store",
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const text = await res.text();
  let data = null;
  if (text) { try { data = JSON.parse(text); } catch (_) { data = null; } }
  const msg = (data && typeof data.error === "string" && data.error) || `HTTP ${res.status}`;
  if (res.status === 401) throw new AuthError(msg);
  if (!res.ok) throw new Error(msg);
  return data;
}
const control = (scope, action, reason) => api("POST", "/v1/control", { scope, action, reason: reason || "dashboard" });
const scopes = {
  global: () => ({ type: "global" }),
  device: (id) => ({ type: "device", id }),
  account: (id) => ({ type: "account", id }),

// State and polling.
const state = { status: null, jobs: null, schedules: null, quota: null, advice: null, events: null, why: null, errors: {}, lastOk: 0, allFailed: false, busy: false, timer: 0, showClosed: false };
// Full explanations are fetched only for the rows a user opened, and re-fetched once per poll.
const whyOpen = new Set();
const whyDetail = new Map();

async function refresh() {
  if (state.busy || !tokenStore.get()) return;
  state.busy = true;
  const filter = $("job-filter").value;
  const jobsPath = `/v1/jobs?limit=100${filter ? `&status=${encodeURIComponent(filter)}` : ""}`;
  const calls = [
    ["status", api("GET", "/v1/status")],
    ["jobs", api("GET", jobsPath)],
    ["schedules", api("GET", "/v1/schedules")],
    ["quota", api("GET", "/v1/quota")],
    ["advice", api("GET", "/v1/advice")],
    ["events", api("GET", "/v1/events?limit=60")],
    ["why", api("GET", "/v1/why")],
  ];
  const openIds = [...whyOpen];
  const detailCalls = openIds.map((id) => api("GET", whyPath(id)));
  const [results, details] = await Promise.all([Promise.allSettled(calls.map((c) => c[1])), Promise.allSettled(detailCalls)]);
  state.busy = false;
  state.allFailed = results.every((r) => r.status === "rejected");
  if ([...results, ...details].some((r) => r.status === "rejected" && r.reason instanceof AuthError)) {
    logout("The coordinator rejected this token. Paste the current one.");
    return;
  }
  let anyOk = false;
  results.forEach((r, i) => {
    const key = calls[i][0];
    if (r.status === "fulfilled") { state[key] = r.value; delete state.errors[key]; anyOk = true; }
    else state.errors[key] = r.reason && r.reason.message ? r.reason.message : "request failed";
  });
  if (anyOk) state.lastOk = Date.now();
  details.forEach((r, i) => whyDetail.set(openIds[i], r.status === "fulfilled" ? { data: r.value } : { error: r.reason && r.reason.message ? r.reason.message : "request failed" }));
  render();
}

function schedule() {
  clearInterval(state.timer);

}

// Actions.
function toast(text, tone) {
  const el = h("div", { class: `toast ${tone || ""}`, role: tone === "bad" ? "alert" : "status" }, text);
  $("toasts").append(el);
  setTimeout(() => el.remove(), tone === "bad" ? 7000 : 3500);
}
async function act(btn, doneText, fn) {
  if (btn) btn.disabled = true;
  try {
    const out = await fn();
    if (doneText) toast(typeof doneText === "function" ? doneText(out) : doneText);
    return out;
  } catch (e) {
    if (e instanceof AuthError) logout("The coordinator rejected this token. Paste the current one.");
    else toast(`Failed: ${e.message}`, "bad");
    return undefined;
  } finally {
    if (btn) btn.disabled = false;
    refresh();
  }
}

const sig = {};

function section(key, deps, boxId, fn) {

  if (sig[key] === next) return;
  sig[key] = next;

// The "why" row of a waiting job: built empty and hidden with the table, then filled in place

function whyShell(j) {

    h("summary", null), h("div", { class: "why-body" }));
}
const whyPath = (id) => `/v1/jobs/${encodeURIComponent(id)}/why`;

function onWhyToggle(e) {
  const el = e.currentTarget;
  const id = Number(el.dataset.key);
  if (el.open === whyOpen.has(id)) return; // a rebuild restoring its own state
  if (!el.open) { whyOpen.delete(id); return; }
  whyOpen.add(id);
  api("GET", whyPath(id)).then((data) => whyDetail.set(id, { data }), (err) => {
    if (err instanceof AuthError) logout("The coordinator rejected this token. Paste the current one.");
    else whyDetail.set(id, { error: err.message });
  }).then(renderWhy);

const WHY_TAG = { queued: "waiting", leased: "starting", paused: "paused" };
const WHY_QUIET = new Set(["last_seen_ms"]); // moves on every heartbeat without a visible change

function renderWhy() {
  const byJob = new Map((state.why || []).map((s) => [s.job, s]));
  const multi = ((state.status && state.status.devices) || []).length > 1;
  const rows = [...$("jobs").querySelectorAll("details.why")];
  const present = new Set(rows.map((el) => Number(el.dataset.key)));
  for (const id of [...whyOpen]) if (!present.has(id)) whyOpen.delete(id);
  for (const id of [...whyDetail.keys()]) if (!present.has(id)) whyDetail.delete(id);
  rows.forEach((el) => {
    const id = Number(el.dataset.key);
    patchWhy(el, byJob.get(id), whyDetail.get(id), multi);
  });
}

function patchWhy(el, summary, detail, multi) {
  const head = summary && summary.headline;
  el.hidden = !head;
  if (!head) { delete el.dataset.sig; return; }
  const next = JSON.stringify([el.dataset.status, multi, summary, detail], (k, v) => (NOT_SHOWN.has(k) || WHY_QUIET.has(k) ? undefined : v));
  if (el.dataset.sig === next) return;
  el.dataset.sig = next;
  const where = multi && head.device ? ` on ${head.device}` : "";
  // replaceChildren turns null into the text "null", so only real nodes and strings go in.
  const line = [h("span", { class: "tag" }, `${WHY_TAG[el.dataset.status] || "waiting"}${where}:`), " ", head.reason.message,
    summary.more ? h("span", { class: "more" }, ` +${summary.more} more`) : null];
  el.querySelector("summary").replaceChildren(...line.filter((k) => k != null));
  el.querySelector(".why-body").replaceChildren(...whyBody(summary, detail).filter((k) => k != null));
}

function reasonList(reasons) {
  return h("ul", { class: "why-list" }, reasons.map((r) => h("li", null, h("div", null, r.message),
    r.fix ? h("div", { class: "fix" }, h("strong", null, "Fix: "), r.fix) : null)));
}

// Until the full explanation arrives, the body shows the headline with its fix.
function whyBody(summary, detail) {
  if (detail && detail.error) return [h("div", { class: "why-note" }, `Could not load the reasons: ${detail.error}`)];
  if (!detail) {
    return [reasonList([summary.headline.reason]), summary.more ? h("div", { class: "why-note" }, "Loading the other reasons") : null];
  }
  const e = detail.data;
  const out = [];
  if (e.reasons.length) out.push(h("div", { class: "why-h" }, "On every device"), reasonList(e.reasons));
  for (const d of e.devices) {
    if (d.reasons.length) out.push(h("div", { class: "why-h" }, `${d.device} (${d.online ? "online" : "offline"})`), reasonList(d.reasons));
  }
  const clear = e.devices.filter((d) => !d.reasons.length).map((d) => d.device);
  if (clear.length) out.push(h("div", { class: "why-note" }, `No device-specific blocker: ${clear.join(", ")}`));
  if (!out.length) out.push(h("div", { class: "why-note" }, e.summary));
  return out;
}

// What a schedule is doing: its running job, when it is next due, and whether it is paused.
function scheduleState(v) {
  const d = v.decision || {};
  const parts = [];
  if (d.kind === "running") parts.push(badge(`job #${d.job} ${label(d.status)}`, JOB_TONE[d.status]));
  else if (d.kind === "wait") parts.push(rel(d.until_ms, "due "));
  else if (d.kind === "fire") parts.push(h("span", { class: "num" }, "due now"));
  if (v.paused) parts.push(badge("paused", "warn"));
  return parts.map((p) => h("div", null, p));
}

function lastResult(r) {
  if (!r) return h("span", { class: "faint" }, "-");
  const note = r.error || (r.exit_code ? `exit ${r.exit_code}` : "");
  return [
    jobBadge(r.status),
    r.finished_ms ? h("div", { class: "t2" }, rel(r.finished_ms)) : null,
    note ? h("div", { class: "t2", style: r.error ? "color:var(--bad)" : null }, note) : null,
  ];
}

async function removeSchedule(btn, v) {
  const name = (v.spec && v.spec.name) || "(unnamed)";
  const ok = await confirmBox(`Remove schedule #${v.id}?`, `${name} stops repeating. A job it already queued keeps running.`, "Remove", true);
  if (ok) act(btn, `Removed schedule #${v.id}`, () => api("DELETE", `/v1/schedules/${encodeURIComponent(v.id)}`));
}

function renderSchedules() {
  const box = $("schedules");
  const list = state.schedules;
  if (state.errors.schedules) { box.replaceChildren(h("div", { class: "err" }, state.errors.schedules)); return; }
  if (!list) { box.replaceChildren(h("div", { class: "empty" }, "Loading")); return; }
  if (!list.length) { box.replaceChildren(h("div", { class: "empty" }, "No schedules yet. Repeat a job with `idlemax schedule add <spec.toml> --every 1d`.")); return; }
  const rows = list.map((v) => {
    const spec = v.spec || {};
    const verb = v.paused ? "resume" : "pause";
    const detail = [`every ${v.every}`, spec.cost ? label(spec.cost) : null, spec.ai_account ? `account ${spec.ai_account}` : null].filter(Boolean).join(" · ");
    return h("tr", null,
      h("td", { class: "c-id num mono" }, `#${v.id}`),
      h("td", { class: "c-name" }, h("div", { class: "job-name" }, spec.name || "(unnamed)"), h("div", { class: "t2" }, detail)),
      h("td", { class: "c-state" }, scheduleState(v)),
      h("td", { class: "c-last" }, lastResult(v.last_result)),
      h("td", { class: "acts" },
        h("button", { class: "btn sm", type: "button", onclick: (e) => act(e.currentTarget, `${v.paused ? "Resumed" : "Paused"} schedule #${v.id}`, () => api("POST", `/v1/schedules/${encodeURIComponent(v.id)}/${verb}`)) }, v.paused ? "Resume" : "Pause"),
        h("button", { class: "btn sm danger", type: "button", onclick: (e) => removeSchedule(e.currentTarget, v) }, "Remove")),
    );
  });
  box.replaceChildren(h("div", { class: "scroll" }, h("table", { class: "sched-table" },
    h("thead", null, h("tr", null, h("th", null, "ID"), h("th", null, "Schedule"), h("th", null, "State"), h("th", null, "Last result"), h("th", { class: "r" }, h("span", { class: "faint" }, "Actions")))),
    h("tbody", null, rows))));
}

function renderAdvice() {
  const box = $("advice");
  const recs = state.advice;
  if (state.errors.advice) { box.replaceChildren(h("div", { class: "err" }, state.errors.advice)); return; }
  if (!recs) { box.replaceChildren(h("div", { class: "empty" }, "Loading")); return; }
  const open = recs.filter((r) => r.status === "open");
  const closed = recs.filter((r) => r.status !== "open");
  const items = open.map((r) => adviceItem(r, true));
  if (!open.length) items.push(h("div", { class: "empty" }, "Nothing needs you right now."));
  if (closed.length) {
    items.push(h("div", { class: "adv", style: "padding:8px 14px" },
      h("button", { class: "btn ghost sm", type: "button", onclick: () => { state.showClosed = !state.showClosed; render(); } },
        state.showClosed ? `Hide ${closed.length} closed` : `Show ${closed.length} closed`)));
    if (state.showClosed) items.push(...closed.slice(0, 30).map((r) => adviceItem(r, false)));
  }
  box.replaceChildren(...items);
}

function adviceItem(r, isOpen) {
  const job = r.suggested_job;
  const conf = r.confidence != null ? `${Math.round(Math.max(0, Math.min(1, r.confidence)) * 100)}% confidence` : null;
  return h("article", { class: `adv ${isOpen ? "" : "closed"}` },
    h("div", { class: "adv-h" }, badge(label(r.kind), KIND_TONE[r.kind]), h("span", { class: "title" }, r.title || "(untitled)"),
      isOpen ? null : badge(label(r.status), r.status === "accepted" ? "ok" : "")),
    r.why ? h("p", null, r.why) : null,
    job ? h("div", { class: "sugg" }, h("span", { class: "muted" }, "Queues "), h("strong", null, job.name || "(unnamed)"),
      h("span", { class: "muted" }, ` · ${label(job.cost)}${job.devices && job.devices.length ? ` · on ${job.devices.join(", ")}` : ""}`),
      job.command && job.command.length ? h("div", { class: "mono", style: "margin-top:4px" }, job.command.join(" ")) : null) : null,
    r.evidence && r.evidence.length ? h("details", null, h("summary", null, `Evidence (${r.evidence.length})`), h("ul", null, r.evidence.map((e) => h("li", null, e)))) : null,
    h("div", { class: "meta" }, h("span", null, r.source === "ai" ? "AI advisor" : "Rules"), conf ? h("span", null, conf) : null, when(r.at_ms)),
    isOpen ? h("div", { class: "adv-a" },
      job ? h("button", { class: "btn sm primary", type: "button", onclick: (e) => act(e.currentTarget, (out) => out && out.id ? `Queued job #${out.id}` : "Accepted", () => api("POST", `/v1/advice/${encodeURIComponent(r.id)}/accept`)) }, "Accept and queue") : null,
      h("button", { class: "btn sm", type: "button", onclick: (e) => act(e.currentTarget, "Dismissed", () => api("POST", `/v1/advice/${encodeURIComponent(r.id)}/dismiss`)) }, "Dismiss")) : null,
  );
}

function windowLabel(w) {
  if (!w) return "window";
  if (w.kind === "weekly") return "Weekly";
  if (w.kind === "rolling") return w.minutes % 60 === 0 ? `${w.minutes / 60}-hour` : `${w.minutes}-minute`;
  return label(w.kind);
}

function renderQuota() {
  const box = $("quota");
  const rows = state.quota;
  if (state.errors.quota) { box.replaceChildren(h("div", { class: "err", style: "padding:0" }, state.errors.quota)); return; }
  if (!rows) { box.replaceChildren(h("div", { class: "empty" }, "Loading")); return; }
  if (!rows.length) { box.replaceChildren(h("div", { class: "empty" }, "No AI accounts configured. Add [[quota.accounts]] to config.toml.")); return; }
  const paused = new Set((state.status && state.status.paused_accounts) || []);
  const byAcct = new Map();
  for (const r of rows) {
    if (!byAcct.has(r.account)) byAcct.set(r.account, []);
    byAcct.get(r.account).push(r);
  }
  box.replaceChildren(...[...byAcct].map(([name, wins]) => {
    // spendable and reasons are the account verdict, repeated on every window row.
    const spendable = wins.length > 0 && wins.every((w) => w.spendable);
    const reasons = wins[0].reasons || [];
    const isPaused = paused.has(name);
    return h("div", { class: "acct" },
      h("div", { class: "acct-h" },
        h("span", { class: "name" }, name),
        h("span", { class: "muted", style: "font-size:12px" }, label(wins[0].provider)),
        isPaused ? badge("paused", "warn") : spendable ? badge("spendable", "ok") : badge("held", ""),
        isPaused
          ? h("button", { class: "btn sm", type: "button", onclick: (e) => act(e.currentTarget, `Resumed ${name}`, () => control(scopes.account(name), "resume")) }, "Resume")
          : h("button", { class: "btn sm", type: "button", onclick: (e) => act(e.currentTarget, `Paused ${name}`, () => control(scopes.account(name), "pause")) }, "Pause")),
      wins.filter((w) => w.window).map(quotaWindow),
      reasons.length ? h("ul", { class: "reasons" }, reasons.map((r) => h("li", null, r))) : null);
  }));
}

const WINDOW_STATE = { not_started: "not started", stale: "stale data", reset_pending: "reset, waiting for data", no_data: "no data" };

function quotaWindow(w) {
  const used = w.used_pct;
  const known = used != null && isFinite(used);
  const pct = known ? Math.max(0, Math.min(100, used)) : 0;
  const line = 100 - Math.max(0, Math.min(100, w.reserve_pct || 0));
  const tone = !known ? "" : pct >= 100 ? "bad" : pct >= line ? "warn" : "";
  const bar = h("span", { class: tone });
  bar.style.width = `${pct}%`;
  const mark = h("i", { title: `reserve starts at ${line}%` });
  mark.style.left = `calc(${line}% - 1px)`;
  const stateNote = WINDOW_STATE[w.state];
  return h("div", { class: "win" },
    h("div", { class: "win-h" },
      h("span", null, h("strong", null, windowLabel(w.window)),
        h("span", { class: "muted num" }, ` ${known ? `${Math.round(used)}% used` : "usage unknown"}, reserve ${fmtPct(w.reserve_pct)}`),
        stateNote ? h("span", { class: "faint" }, `, ${stateNote}`) : null),
      w.resets_at_ms ? rel(w.resets_at_ms, "resets ", "muted num") : h("span", { class: "muted num" }, "reset unknown")),
    h("div", { class: "meter", role: "img", "aria-label": known ? `${Math.round(used)} percent used, reserve from ${line} percent` : "usage unknown" }, bar, mark),
  );
}

function renderEvents() {
  const box = $("events");
  const evs = state.events;
  if (state.errors.events) { box.replaceChildren(h("div", { class: "err" }, state.errors.events)); return; }
  if (!evs) { box.replaceChildren(h("div", { class: "empty" }, "Loading")); return; }
  if (!evs.length) { box.replaceChildren(h("div", { class: "empty" }, "No events yet.")); return; }
  const tone = (k) => /failed|killed|offline|error|expired/.test(k) ? "bad" : /parked|paused|guard|quota/.test(k) ? "warn" : /succeeded|online/.test(k) ? "ok" : "";
  box.replaceChildren(...evs.map((e) => h("div", { class: "ev" },
    h("span", { class: "when num mono", title: fmtTime(e.at_ms) }, clock(e.at_ms)),
    h("span", { class: "what" }, badge(label(e.kind), tone(String(e.kind))),
      e.device ? h("span", { class: "muted" }, e.device) : null,
      e.job != null ? h("span", { class: "muted mono" }, `#${e.job}`) : null),
    e.message ? h("span", { class: "msg" }, e.message) : null,
  )));
}

// Login flow.
function logout(msg) {
  tokenStore.set("");
  clearInterval(state.timer);
  Object.assign(state, { status: null, jobs: null, schedules: null, quota: null, advice: null, events: null, why: null, errors: {}, lastOk: 0 });
  whyOpen.clear();
  whyDetail.clear();
  Object.keys(sig).forEach((k) => delete sig[k]);
  $("app").hidden = true;
  $("login").hidden = false;
  const err = $("login-err");
  err.textContent = msg || "";
  err.hidden = !msg;
  $("token-input").value = "";
  $("token-input").focus();
}
function start() {
  $("login").hidden = true;
  $("app").hidden = false;
  render();
  refresh();
  schedule();
}
$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const t = $("token-input").value.trim();
  if (!t) return;
  tokenStore.set(t);
  const btn = e.submitter || null;
  if (btn) btn.disabled = true;
  try {
    await api("GET", "/v1/status");
    start();
  } catch (err) {
    if (err instanceof AuthError) logout("That token was rejected.");
    else { tokenStore.set(""); $("login-err").textContent = `Cannot reach the coordinator: ${err.message}`; $("login-err").hidden = false; }
  } finally {
    if (btn) btn.disabled = false;
  }
});

if (tokenStore.get()) start(); else logout("");
})();
</script>
</body>
</html>
