<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>idlemax</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f6b66'/%3E%3Cpath d='M5 4h2v8H5zM9 4h2v8H9z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --bg: #f3f4f6;
  --panel: #ffffff;
  --panel-2: #f8f9fa;
  --ink: #16191d;
  --muted: #5c6570;
  --faint: #6b747e;
  --line: #e0e4e9;
  --line-strong: #c9cfd6;
  --control: #858d97;
  --accent: #0f6b66;
  --accent-ink: #ffffff;
  --ok: #17663f;
  --ok-bg: #e3f3ea;
  --warn: #855400;
  --warn-bg: #fbefd5;
  --bad: #b0261c;
  --bad-bg: #fbe7e4;
  --info: #24529f;
  --info-bg: #e6edfa;
  --neutral-bg: #eaedf1;
  --focus: #2d6fd6;
  --radius: 8px;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0e1013;
    --panel: #16191e;
    --panel-2: #1b1f25;
    --ink: #e6e9ed;
    --muted: #9ba4ae;
    --faint: #808993;
    --line: #272c33;
    --line-strong: #363c45;
    --control: #6b747e;
    --accent: #3cb3a9;
    --accent-ink: #071413;
    --ok: #55c48e;
    --ok-bg: #12301f;
    --warn: #e2ac43;
    --warn-bg: #33270e;
    --bad: #f17b70;
    --bad-bg: #3a1613;
    --info: #80a9ef;
    --info-bg: #14223a;
    --neutral-bg: #232830;
    --focus: #6ea2f5;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
[hidden] { display: none !important; }

/* Header */
.top {
  position: sticky; top: 0; z-index: 5;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 1320px; margin: 0 auto; padding: 10px 16px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
}
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
.brand h1 { font-size: 17px; margin: 0; letter-spacing: 0.01em; }
.brand .ver { font-size: 12px; color: var(--faint); }
.updated { font-size: 12px; color: var(--muted); white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 12px;
  border: 1px solid var(--line-strong); border-radius: 6px;
  background: var(--panel); color: var(--ink);
  cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: 500;
}
.btn:hover { background: var(--panel-2); }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line-strong)); }
.btn.danger:hover { background: var(--bad-bg); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: var(--accent-ink); }
.btn.danger.solid:hover { background: var(--bad); filter: brightness(1.08); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--panel-2); }

/* Badges */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 7px; border-radius: 10px;
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.01em;
  background: var(--neutral-bg); color: var(--muted); white-space: nowrap;
}
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.info { background: var(--info-bg); color: var(--info); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }

/* Layout */
main { max-width: 1320px; margin: 0 auto; padding: 16px; }
.banner {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding: 10px 14px; margin-bottom: 14px;
  border-radius: var(--radius); border: 1px solid; font-weight: 500;
}
.banner.warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.banner.bad { background: var(--bad-bg); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 22px; font-weight: 600; line-height: 1.2; margin-top: 2px; }
.tile .v.bad { color: var(--bad); }
.tile .v.warn { color: var(--warn); }
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1080px) { .grid { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); } }
.col { display: grid; gap: 14px; align-content: start; min-width: 0; }

/* Cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.card-h {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  padding: 12px 14px; border-bottom: 1px solid var(--line);
}
.card-h h2 { font-size: 13.5px; margin: 0 auto 0 0; font-weight: 650; }
.card-b { padding: 12px 14px; }
.card-b.flush { padding: 0; }
.empty { color: var(--muted); padding: 14px; text-align: center; font-size: 13px; }
.err { color: var(--bad); padding: 10px 14px; font-size: 13px; }

/* Devices */
.devices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.dev { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; background: var(--panel-2); min-width: 0; }
.dev-h { display: flex; align-items: flex-start; gap: 8px; }
.dev-h .name { font-weight: 650; overflow-wrap: anywhere; }
.dev-h .sub { font-size: 12px; color: var(--muted); }
.dev-h .badges { margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
.capacity { margin-top: 10px; }
.caps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; }
.cap-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 6px; font-size: 12px; }
.cap-h span { white-space: nowrap; }
.cap-why { display: flex; align-items: baseline; gap: 6px; margin-top: 8px; font-size: 12.5px; }
.cap-why .badge { flex: none; align-self: flex-start; }
.cap-why span:last-child { min-width: 0; overflow-wrap: anywhere; }
.guard { margin: 10px 0 0; font-size: 12.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.reasons { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); }
.reasons li { display: flex; gap: 5px; overflow-wrap: anywhere; }
.reasons li::before { content: "-"; flex: none; color: var(--faint); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 10px; margin-top: 10px; }
.stat .k { font-size: 11px; color: var(--muted); }
.stat .v { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.dev-jobs { margin-top: 10px; font-size: 12.5px; display: grid; gap: 4px; }
.dev-jobs .row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.dev-jobs .row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dev-jobs .row .badge, .dev-jobs .row .faint { flex: none; white-space: nowrap; }
.dev-a { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
.dev-note { font-size: 12.5px; color: var(--muted); }

/* Tables */
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--panel-2); white-space: nowrap; }
th:first-child, td:first-child { padding-left: 14px; }
th:last-child, td:last-child { padding-right: 14px; }
tbody tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td.nw { white-space: nowrap; }
td.c-dev { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td .t2 { font-size: 12px; color: var(--muted); margin-top: 1px; overflow-wrap: anywhere; }
td.acts { white-space: nowrap; text-align: right; }
td.acts .btn + .btn { margin-left: 4px; }
.job-name { font-weight: 600; overflow-wrap: anywhere; }

/* Why a queued, leased or paused job is not running: one line, expandable to every reason. */
.why { margin-top: 6px; font-size: 12.5px; }
.why summary { display: flex; gap: 6px; align-items: baseline; cursor: pointer; color: var(--muted); list-style: none; }
.why summary::-webkit-details-marker { display: none; }
.why summary::before { content: "\25B8"; flex: none; }
.why[open] summary::before { content: "\25BE"; }
.why summary .tag { color: var(--warn); font-weight: 600; }
.why summary .more { color: var(--faint); white-space: nowrap; }
/* Two lines when closed; the whole text once opened, so the opened body need not repeat it. */
.why-line { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.why[open] .why-line { display: block; -webkit-line-clamp: unset; line-clamp: unset; overflow: visible; }
/* The why of a waiting job is its own row under the job, as wide as the table or the card. */
.jobs-table td { border-bottom: 0; border-top: 1px solid var(--line); }
.jobs-table tbody tr:first-child td { border-top: 0; }
/* The summary no longer sits in the Job cell to widen it, so name the column's share. */
.jobs-table thead th:nth-child(2) { width: 42%; }
.jobs-table tr.has-why td { padding-bottom: 2px; }
.jobs-table tr.why-row td { border-top: 0; padding: 0 14px 10px 10px; }
.jobs-table tr.why-row td.c-id { padding: 0; }
.jobs-table .why { margin-top: 0; }
.why-body { margin-top: 6px; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; overflow-wrap: anywhere; }
.why-h { margin-top: 8px; font-size: 12px; font-weight: 600; }
.why-h:first-child { margin-top: 0; }
.why-list { margin: 4px 0 0; padding-left: 18px; }
.why-list li + li { margin-top: 6px; }
.why-list .fix { color: var(--muted); }
.why-note, .why-fix { margin-top: 8px; color: var(--muted); }
.why-note:first-child, .why-fix:first-child { margin-top: 0; }
.sched-table td.c-state > div + div { margin-top: 4px; }
select {
  height: 28px; padding: 0 8px; border: 1px solid var(--control); border-radius: 6px;
  background: var(--panel); font-size: 12.5px;
}

/* Did it help? The report: a verdict line per period, the numbers behind it underneath. */
.rep + .rep { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.rep-v { font-weight: 600; overflow-wrap: anywhere; }
.rep-v.warn { color: var(--warn); }
.rep-l { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
.rep-l li { overflow-wrap: anywhere; }
.rep-l li + li { margin-top: 2px; }

/* Quota */
.acct + .acct { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.acct-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.acct-h .name { font-weight: 650; margin-right: auto; }
.win { margin-top: 10px; }
.win-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; font-size: 12.5px; }
.meter { position: relative; height: 8px; border-radius: 4px; background: var(--neutral-bg); margin-top: 5px; overflow: hidden; }
.meter > span { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; }
.meter > span.warn { background: var(--warn); }
.meter > span.bad { background: var(--bad); }
.disp-list { display: grid; gap: 6px; font-size: 12.5px; margin-top: 8px; }
.disp-list:first-child { margin-top: 0; }
.disp-list .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
.disp-list .row .t { overflow-wrap: anywhere; }
.acct .t2, .card-b > .t2, .limit .t2 { font-size: 12px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
.disp-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.seg { display: inline-flex; gap: 4px; margin-right: auto; }
.disp-table { width: 100%; }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 4px 10px; margin-top: 6px; }
.win.day .win-h { font-size: 11.5px; }
.win.day .meter { height: 5px; }
.limit + .limit { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.limit label { display: block; font-size: 12.5px; margin-bottom: 4px; }
.limit-c { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.limit-c input { width: 7em; height: 26px; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; }
.meter > i { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--ink); opacity: 0.55; }
.win .reasons { margin-top: 4px; }

/* Advice */
.adv + .adv { border-top: 1px solid var(--line); }
.adv { padding: 12px 14px; }
.adv-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
.adv-h .title { font-weight: 650; flex: 1 1 200px; overflow-wrap: anywhere; }
.adv p { margin: 6px 0 0; color: var(--ink); overflow-wrap: anywhere; }
.adv .meta { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.adv details { margin-top: 6px; font-size: 12.5px; }
.adv summary { cursor: pointer; color: var(--muted); }
.adv ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
.adv li { overflow-wrap: anywhere; }
.adv .sugg { margin-top: 8px; font-size: 12.5px; padding: 8px 10px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); overflow-wrap: anywhere; }
.adv-a { display: flex; gap: 6px; margin-top: 10px; }
.adv.closed { opacity: 0.7; }

/* Events: a log pane, so it scrolls instead of stretching the page */
#events { max-height: min(60vh, 520px); overflow-y: auto; overscroll-behavior: contain; }
.ev { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 2px 10px; padding: 7px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.ev:last-child { border-bottom: 0; }
.ev .when { color: var(--muted); }
.ev .what { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0; }
.ev .msg { grid-column: 2; overflow-wrap: anywhere; }

/* Login */
.login { max-width: 420px; margin: 12vh auto 0; padding: 0 16px; }
.login .card-b { display: grid; gap: 10px; }
.login label { font-size: 13px; color: var(--muted); }
.login input {
  height: 36px; padding: 0 10px; border: 1px solid var(--control); border-radius: 6px;
  background: var(--panel); width: 100%;
}
.login code { font-family: var(--mono); font-size: 12px; background: var(--neutral-bg); padding: 1px 5px; border-radius: 4px; }
.login .err { padding: 0; }

/* Dialog and toasts */
dialog {
  border: 1px solid var(--line-strong); border-radius: 10px; padding: 0;
  background: var(--panel); color: var(--ink); width: min(440px, calc(100vw - 32px));
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
}
dialog::backdrop { background: rgba(10, 12, 15, 0.45); }
dialog .card-b p { margin: 0; }
dialog .foot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 14px 14px; }
.toasts { position: fixed; right: 16px; bottom: 16px; left: 16px; display: grid; justify-items: end; gap: 8px; pointer-events: none; z-index: 20; }
.toast {
  max-width: min(420px, 100%);
  padding: 9px 12px; border-radius: 8px; font-size: 13px;
  background: var(--ink); color: var(--panel); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
}
.toast.bad { background: var(--bad-bg); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }

/* Phone: jobs become stacked cards, the header stops sticking, targets reach 44 px. */
@media (max-width: 640px) {
  .jobs-table thead { display: none; }
  .jobs-table, .jobs-table tbody { display: block; }
  .jobs-table tr {
    display: grid; grid-template-columns: 3.2rem minmax(0, 1fr) auto;
    grid-template-areas: "id job status" ". dev created" ". acts acts";
    gap: 4px 10px; padding: 12px 14px; border-top: 1px solid var(--line);
  }
  .jobs-table tbody tr:first-child { border-top: 0; }
  .jobs-table tr.has-why { padding-bottom: 2px; }
  .jobs-table tr.why-row { display: block; padding: 0 14px 12px; border-top: 0; }
  .jobs-table tr.why-row[hidden] { display: none; }
  .jobs-table tr.why-row td, .jobs-table tr.why-row td:last-child { display: block; padding: 0; border: 0; }
  .jobs-table tr.why-row td.c-id { display: none; }
  .jobs-table td { display: block; padding: 0; border: 0; text-align: left; }
  .jobs-table td.c-id { grid-area: id; }
  .jobs-table td.c-job { grid-area: job; }
  .jobs-table td.c-status { grid-area: status; text-align: right; }
  .jobs-table td.c-dev { grid-area: dev; max-width: none; }
  .jobs-table td.c-dev > .faint { display: none; }
  .jobs-table td.c-created { grid-area: created; text-align: right; }
  .jobs-table td.acts { grid-area: acts; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; white-space: normal; }
  .jobs-table td.acts:empty { display: none; }
  .jobs-table td.acts .btn + .btn { margin-left: 0; }
}
@media (max-width: 640px) {
  .sched-table thead { display: none; }
  .sched-table, .sched-table tbody { display: block; }
  .sched-table tr {
    display: grid; grid-template-columns: 3.2rem minmax(0, 1fr) auto;
    grid-template-areas: "id name state" ". last last" ". acts acts";
    gap: 4px 10px; padding: 12px 14px; border-bottom: 1px solid var(--line);
  }
  .sched-table tbody tr:last-child { border-bottom: 0; }
  .sched-table td { display: block; padding: 0; border: 0; text-align: left; }
  .sched-table td.c-id { grid-area: id; }
  .sched-table td.c-name { grid-area: name; }
  .sched-table td.c-state { grid-area: state; text-align: right; }
  .sched-table td.c-last { grid-area: last; }
  .sched-table td.acts { grid-area: acts; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; white-space: normal; }
  .sched-table td.acts .btn + .btn { margin-left: 0; }
}
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tiles .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .btn { height: 44px; }
  .btn.sm { height: 40px; padding: 0 12px; }
  select { height: 40px; }
  .top { position: static; }
  .top-in { padding: 10px 16px; }
  .actions { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .actions .btn { padding: 0 6px; }
  #btn-logout { grid-column: span 2; }
}
</style>
</head>
<body>
<noscript><p style="padding:16px">The idlemax dashboard needs JavaScript.</p></noscript>

<section class="login" id="login" hidden>
  <div class="card">
    <div class="card-h"><h2>Connect to idlemax</h2></div>
    <form class="card-b" id="login-form" autocomplete="off">
      <label for="token-input">Paste the token from <code>$IDLEMAX_HOME/token</code> on the coordinator.</label>
      <input id="token-input" type="password" spellcheck="false" autocapitalize="off" required>
      <div class="err" id="login-err" role="alert" hidden></div>
      <div><button class="btn primary" type="submit">Connect</button></div>
    </form>
  </div>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand"><h1>idlemax</h1><span class="ver" id="ver"></span><span id="cluster-badge"></span></div>
      <span class="updated" id="updated" aria-live="polite"></span>
      <div class="actions">
        <button class="btn" type="button" id="btn-refresh">Refresh</button>
        <button class="btn" type="button" id="btn-pause">Pause all</button>
        <button class="btn" type="button" id="btn-resume">Resume all</button>
        <button class="btn danger" type="button" id="btn-stop">Stop all</button>
        <button class="btn ghost" type="button" id="btn-logout" title="Forget the token in this browser">Forget token</button>
      </div>
    </div>
  </header>

  <main>
    <div id="banners"></div>
    <div class="tiles" id="tiles"></div>
    <div class="grid">
      <div class="col">
        <section class="card" id="card-dispatcher" aria-labelledby="h-dispatcher" hidden>
          <div class="card-h"><h2 id="h-dispatcher">Dispatcher</h2></div>
          <div class="card-b" id="dispatcher"></div>
        </section>
        <section class="card" aria-labelledby="h-report">
          <div class="card-h"><h2 id="h-report">Did it help?</h2></div>
          <div class="card-b" id="report"></div>
        </section>
        <section class="card" aria-labelledby="h-devices">
          <div class="card-h"><h2 id="h-devices">Devices</h2></div>
          <div class="card-b" id="devices"></div>
        </section>
        <section class="card" aria-labelledby="h-schedules">
          <div class="card-h"><h2 id="h-schedules">Schedules</h2></div>
          <div class="card-b flush" id="schedules"></div>
        </section>
        <section class="card" aria-labelledby="h-jobs">
          <div class="card-h">
            <h2 id="h-jobs">Jobs</h2>
            <label class="muted" for="job-filter" style="font-size:12px">Status</label>
            <select id="job-filter">
              <option value="">All</option>
              <option>queued</option><option>leased</option><option>running</option><option>paused</option>
              <option>succeeded</option><option>failed</option><option>killed</option><option>cancelled</option><option>parked</option>
            </select>
          </div>
          <div class="card-b flush" id="jobs"></div>
        </section>
      </div>
      <div class="col">
        <section class="card" id="card-needs" aria-labelledby="h-needs" hidden>
          <div class="card-h"><h2 id="h-needs">Needs you</h2></div>
          <div class="card-b" id="needs"></div>
        </section>
        <section class="card" id="card-review" aria-labelledby="h-review" hidden>
          <div class="card-h"><h2 id="h-review">Waiting for review</h2></div>
          <div class="card-b" id="review"></div>
        </section>
        <section class="card" id="card-budget" aria-labelledby="h-budget" hidden>
          <div class="card-h"><h2 id="h-budget">Budget</h2></div>
          <div class="card-b" id="budget"></div>
        </section>
        <section class="card" id="card-projects" aria-labelledby="h-projects" hidden>
          <div class="card-h"><h2 id="h-projects">Projects</h2></div>
          <div class="card-b" id="projects"></div>
        </section>
        <section class="card" id="card-limits" aria-labelledby="h-limits" hidden>
          <div class="card-h"><h2 id="h-limits">Limits</h2></div>
          <div class="card-b" id="limits"></div>
        </section>
        <section class="card" id="card-rules" aria-labelledby="h-rules" hidden>
          <div class="card-h"><h2 id="h-rules">Rule proposals</h2></div>
          <div class="card-b flush" id="rules"></div>
        </section>
        <section class="card" aria-labelledby="h-advice">
          <div class="card-h">
            <h2 id="h-advice">Advice</h2>
            <button class="btn sm" type="button" id="btn-advice-refresh">Re-run advisor</button>
          </div>
          <div class="card-b flush" id="advice"></div>
        </section>
        <section class="card" aria-labelledby="h-quota">
          <div class="card-h"><h2 id="h-quota">AI quota</h2></div>
          <div class="card-b" id="quota"></div>
        </section>
        <section class="card" aria-labelledby="h-events">
          <div class="card-h"><h2 id="h-events">Events</h2></div>
          <div class="card-b flush" id="events" tabindex="0" role="region" aria-labelledby="h-events"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<dialog id="confirm" aria-labelledby="confirm-title">
  <div class="card-h"><h2 id="confirm-title">Confirm</h2></div>
  <div class="card-b"><p id="confirm-text"></p></div>
  <div class="foot">
    <button class="btn" type="button" id="confirm-no">Cancel</button>
    <button class="btn primary" type="button" id="confirm-yes">Confirm</button>
  </div>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/dashboard.js"></script>
</body>
</html>
